name: langlab

services:
  pocketbase:
    build:
      context: .
      args:
        PB_VERSION: 0.39.11
    container_name: langlab-pb
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    # только для nginx на этом же хосте, наружу порт не открываем
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./pb_data:/pb/pb_data           # база и загрузки (не в git)
      - ./pb_migrations:/pb/pb_migrations # схема коллекций (в git)
      - ./pb_hooks:/pb/pb_hooks         # свои эндпоинты (в git)
    environment:
      TZ: Europe/Moscow
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
